[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "business-data-portfolio"
version = "1.0.0"
description = "Five reproducible analytics projects with financial and behavioral judgment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "ipykernel>=6.29,<7",
  "matplotlib>=3.9,<4",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<24",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "yfinance>=0.2.54,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
