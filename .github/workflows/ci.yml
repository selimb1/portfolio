name: portfolio-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/run_all.py --offline
      - run: python scripts/build_notebooks.py
      - run: python -m pytest -q
      - run: python scripts/validate_portfolio.py
